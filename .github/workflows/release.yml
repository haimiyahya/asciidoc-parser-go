name: Test and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false

      - name: Run tests
        run: go test ./... -v -race

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build Release Binaries
    needs: [vulnerability-scan, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: asciidoc-windows-amd64
            goos: windows
            goarch: amd64
            binary: asciidoc
            ext: .exe
          - name: asciidoc-linux-amd64
            goos: linux
            goarch: amd64
            binary: asciidoc
            ext: ''
          - name: asciidoc-linux-arm64
            goos: linux
            goarch: arm64
            binary: asciidoc
            ext: ''
          - name: asciidoc-lsp-windows-amd64
            goos: windows
            goarch: amd64
            binary: asciidoc-lsp
            ext: .exe
          - name: asciidoc-lsp-linux-amd64
            goos: linux
            goarch: amd64
            binary: asciidoc-lsp
            ext: ''
          - name: asciidoc-lsp-linux-arm64
            goos: linux
            goarch: arm64
            binary: asciidoc-lsp
            ext: ''
          - name: asciidoc-darwin-amd64
            goos: darwin
            goarch: amd64
            binary: asciidoc
            ext: ''
          - name: asciidoc-lsp-darwin-amd64
            goos: darwin
            goarch: amd64
            binary: asciidoc-lsp
            ext: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false

      - name: Build binary
        run: |
          output="${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          echo "Building $output"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "$output" ./cmd/${{ matrix.binary }}
          chmod +x "$output" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Artifact contents:"
          ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SBOM
        run: |
          # Install syft
          wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # Generate SBOM in SPDX format
          syft . -o spdx-json > artifacts/SBOM-spdx.json
          syft . -o cyclonedx-json > artifacts/SBOM-cyclonedx.json
          syft . -o table > artifacts/SBOM.txt
          echo "SBOM generated:"
          ls -la artifacts/SBOM*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AsciiDoc Parser Go Release ${{ github.ref_name }}

            ### Binaries

            - **asciidoc** - Main CLI tool for converting AsciiDoc to HTML5, PDF, DocBook, Man Page, EPUB
            - **asciidoc-lsp** - Language Server Protocol for editor integration

            ### Installation

            Download the binary for your platform, make it executable (Linux/macOS), and place it in your PATH.

            ```bash
            # Linux (Intel/AMD64)
            chmod +x asciidoc-linux-amd64
            mv asciidoc-linux-amd64 /usr/local/bin/asciidoc

            # Linux (ARM64)
            chmod +x asciidoc-linux-arm64
            mv asciidoc-linux-arm64 /usr/local/bin/asciidoc

            # macOS (Intel)
            chmod +x asciidoc-darwin-amd64
            mv asciidoc-darwin-amd64 /usr/local/bin/asciidoc

            # Windows
            # Rename asciidoc-windows-amd64.exe to asciidoc.exe and add to PATH
            ```

            ### Verify Checksum

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### SBOM (Software Bill of Materials)

            This release includes SBOM files in multiple formats:
            - `SBOM-spdx.json` - SPDX JSON format
            - `SBOM-cyclonedx.json` - CycloneDX JSON format
            - `SBOM.txt` - Human-readable table format

            ### Docker

            ```bash
            docker pull ghcr.io/haimiyahya/asciidoc-parser-go:${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

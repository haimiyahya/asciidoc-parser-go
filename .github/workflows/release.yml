name: Test and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./... -v -race

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: asciidoc-windows-amd64
            goos: windows
            goarch: amd64
            binary: asciidoc
            ext: .exe
          - name: asciidoc-linux-amd64
            goos: linux
            goarch: amd64
            binary: asciidoc
            ext: ''
          - name: asciidoc-linux-arm64
            goos: linux
            goarch: arm64
            binary: asciidoc
            ext: ''
          - name: asciidoc-lsp-windows-amd64
            goos: windows
            goarch: amd64
            binary: asciidoc-lsp
            ext: .exe
          - name: asciidoc-lsp-linux-amd64
            goos: linux
            goarch: amd64
            binary: asciidoc-lsp
            ext: ''
          - name: asciidoc-lsp-linux-arm64
            goos: linux
            goarch: arm64
            binary: asciidoc-lsp
            ext: ''
          - name: asciidoc-darwin-amd64
            goos: darwin
            goarch: amd64
            binary: asciidoc
            ext: ''
          - name: asciidoc-darwin-arm64
            goos: darwin
            goarch: arm64
            binary: asciidoc
            ext: ''
          - name: asciidoc-lsp-darwin-amd64
            goos: darwin
            goarch: amd64
            binary: asciidoc-lsp
            ext: ''
          - name: asciidoc-lsp-darwin-arm64
            goos: darwin
            goarch: arm64
            binary: asciidoc-lsp
            ext: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        run: |
          output="${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          echo "Building $output"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "$output" ./cmd/${{ matrix.binary }}
          chmod +x "$output" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          cd artifacts
          # Move all files from subdirectories, renaming if there's a conflict
          for dir in */; do
            dir="${dir%/}"
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  basename=$(basename "$file")
                  # If target exists as directory, remove it first
                  if [ -d "$basename" ]; then
                    rm -rf "$basename"
                  fi
                  mv "$file" .
                fi
              done
              rmdir "$dir" 2>/dev/null || true
            fi
          done
          ls -la

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AsciiDoc Parser Go Release ${{ github.ref_name }}

            ### Binaries

            - **asciidoc** - Main CLI tool for converting AsciiDoc to HTML5, PDF, DocBook, Man Page, EPUB
            - **asciidoc-lsp** - Language Server Protocol for editor integration

            ### Installation

            Download the binary for your platform, make it executable (Linux/macOS), and place it in your PATH.

            ```bash
            # Linux/macOS (Intel)
            chmod +x asciidoc-linux-amd64  # or asciidoc-darwin-amd64
            mv asciidoc-linux-amd64 /usr/local/bin/asciidoc

            # macOS (Apple Silicon M1/M2/M3)
            chmod +x asciidoc-darwin-arm64
            mv asciidoc-darwin-arm64 /usr/local/bin/asciidoc

            # Windows
            # Rename asciidoc-windows-amd64.exe to asciidoc.exe and add to PATH
            ```

            ### Verify Checksum

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/haimiyahya/asciidoc-parser-go:${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
